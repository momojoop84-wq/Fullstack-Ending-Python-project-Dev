<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DevData</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import de Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Tableau de Bord Statistique</h1>
            <a href="index.html" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Retour Liste</a>
        </div>

        <!-- Cartes KPI (Key Performance Indicators) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <!-- Carte Total DB -->
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
                <div class="text-gray-500 text-sm font-semibold uppercase">Base de Données</div>
                <div class="text-3xl font-bold text-gray-800 mt-2" id="kpi-db">-</div>
                <div class="text-xs text-green-600 mt-1">Étudiants persistants</div>
            </div>

            <!-- Carte Total JSON -->
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-yellow-500">
                <div class="text-gray-500 text-sm font-semibold uppercase">Fichier JSON</div>
                <div class="text-3xl font-bold text-gray-800 mt-2" id="kpi-json">-</div>
                <div class="text-xs text-yellow-600 mt-1">En attente d'import</div>
            </div>

            <!-- Carte Total Global -->
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
                <div class="text-gray-500 text-sm font-semibold uppercase">Total Étudiants</div>
                <div class="text-3xl font-bold text-gray-800 mt-2" id="kpi-total">-</div>
                <div class="text-xs text-blue-600 mt-1">Portée globale</div>
            </div>
        </div>

        <!-- Graphiques -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Graphique Répartition Classes -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-lg font-bold text-gray-700 mb-4">Répartition par Classe</h3>
                <div class="h-64">
                    <canvas id="chartClasses"></canvas>
                </div>
            </div>

            <!-- Graphique Moyennes -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-lg font-bold text-gray-700 mb-4">Moyenne Générale par Classe</h3>
                <div class="h-64">
                    <canvas id="chartMoyennes"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script src="../js/dashboard.js"></script>
</body>
</html>
